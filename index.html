<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>矿物跑量统计 · 牙牙大王</title>
    <style>
        :root {
            --scale: 1;
            --design-w: 480;
            --design-h: 800;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: "微软雅黑", "Microsoft YaHei", sans-serif;
            background: white;
        }
        body { display: flex; justify-content: center; align-items: center; }
        #app-container {
            width: 480px; height: 800px;
            position: relative;
            transform: scale(var(--scale));
            transform-origin: top left;
            background: white;
            overflow: hidden;
            user-select: none;
            color: black;
        }
        .page {
            position: absolute; top:0; left:0; width:100%; height:100%;
            display: none; background: white;
        }
        .page.active { display: block; }

        #mainPage { background: white; }
        #bgLayer {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background-color: white; z-index: 0;
        }
        #mainContent {
            position: relative; z-index: 1; width: 100%; height: 100%;
            padding: 10px;
            overflow-y: auto;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        #mainContent::-webkit-scrollbar { display: none; }

        .icon-block {
            display: inline-block; width: 48px; height: 48px;
            border: 1px solid #ccc; border-radius: 4px;
        }
        .entry-field {
            font-size: 16px; font-weight: bold; text-align: center;
            border: 1px solid #aaa; padding: 4px; background: white; color: black;
        }
        .restore-btn {
            font-size: 16px; font-weight: bold; background: #ffb6c1; color: white;
            border: none; width: 40px; height: 40px; cursor: pointer; border-radius: 4px;
        }

        .cust-select { position: relative; display: inline-block; }
        .cust-select input {
            padding: 4px 8px; font-size: 14px; border: 1px solid #aaa;
            text-align: center; background: white; color: black; cursor: pointer;
            box-sizing: border-box;
        }
        .cust-select .dropdown-btn {
            position: absolute; right: 0; top: 0; height: 100%;
            width: 24px; background: #eee; border: 1px solid #aaa;
            border-left: none; cursor: pointer; font-size: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        .cust-select .options {
            position: absolute; top: 100%; left: 0; width: 100%;
            background: white; border: 1px solid #aaa;
            max-height: 150px; overflow-y: auto; z-index: 20; display: none;
        }
        .cust-select .options div { padding: 4px 8px; font-size: 14px; cursor: pointer; }
        .cust-select .options div:hover { background: #ffb6c1; }

        .result-list {
            background: white; border: 2px solid #ccc;
            margin: 10px; padding: 10px;
        }
        .result-row {
            display: flex; padding: 14px 0;
            border-bottom: 1px solid #eee;
            font-size: 18px; font-weight: bold;
        }
        .result-row:last-child { border-bottom: none; }
        .result-label {
            color: #ff69b4; font-weight: bold;
            width: 70px; text-align: right; margin-right: 10px; white-space: nowrap;
        }
        .result-value { color: black; font-weight: bold; }

        .total-entry { width: 80px; text-align: center; padding: 4px; font-size: 14px; }

        /* 历史页面 */
        #historyContent {
            flex: 1; overflow-y: auto;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        #historyContent::-webkit-scrollbar { display: none; }
        .date-group { margin-bottom: 10px; }
        .date-title {
            font-weight: bold; cursor: pointer;
            padding: 8px; background: #f0f4f8; border-radius: 6px;
            margin-bottom: 5px; font-size: 14px;
        }
        .date-title:hover { background: #e0e8f0; }
        .records-list { padding-left: 10px; font-size: 13px; line-height: 1.8; }
        .history-item {
            background: #fafafa; margin: 5px 0; padding: 8px;
            border-left: 4px solid #4CAF50; font-size: 13px;
        }
        .history-check { margin-right: 8px; }
        .note-text { color: #777; font-style: italic; cursor: pointer; margin-left: 8px; }
        .note-text:hover { text-decoration: underline; }

        button, input, select, textarea, label, h3, p, div { font-family: inherit; }
    </style>
</head>
<body>
<div id="app-container">

    <!-- 主界面 -->
    <div id="mainPage" class="page active">
        <div id="bgLayer"></div>
        <div id="mainContent">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:70px; margin-top:60px;">
                <button id="totalBtn" style="background:white; padding:8px 16px; font-weight:bold; font-size:20px; height:48px; line-height:1;" onclick="showPage('totalPage')">矿物总量：0</button>
                <div style="margin-right:45px; display:flex; gap:10px; align-items:center;">
                    <button style="font-size:30px; background:transparent; border:none; cursor:pointer; width:40px; height:40px; line-height:1;" onclick="showPage('settingsPage')">⚙️</button>
                    <button style="font-size:30px; background:transparent; border:none; cursor:pointer; width:40px; height:40px; line-height:1;" onclick="showPage('historyPage')">⏰</button>
                </div>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <div style="width:200px;">
                    <div style="margin-bottom:35px;"><label style="font-weight:bold;font-size:16px;">日期：</label><input id="dateVar" class="entry-field" style="width:80px;" readonly></div>
                    <div style="margin-bottom:35px;"><label style="font-weight:bold;font-size:16px;">用时：</label>
                        <div class="cust-select"><input id="timeInput" style="width:80px;height:30px;" onfocus="this.select()"><div class="dropdown-btn" onclick="toggleDropdown(this)">▼</div><div class="options"><div onclick="selectDropdownValue(this)">1h</div><div onclick="selectDropdownValue(this)">2h</div><div onclick="selectDropdownValue(this)">3h</div><div onclick="selectDropdownValue(this)">4h</div><div onclick="selectDropdownValue(this)">5h</div><div onclick="selectDropdownValue(this)">6h</div><div onclick="selectDropdownValue(this)">7h</div><div onclick="selectDropdownValue(this)">8h</div><div onclick="selectDropdownValue(this)">9h</div><div onclick="selectDropdownValue(this)">10h</div></div></div>
                    </div>
                    <div style="margin-bottom:35px;"><label style="font-weight:bold;font-size:16px;">精灵：</label>
                        <div class="cust-select"><input id="pokemonInput" style="width:100px;height:30px;"><div class="dropdown-btn" onclick="toggleDropdown(this)">▼</div><div class="options"><div onclick="selectDropdownValue(this)">六爱</div><div onclick="selectDropdownValue(this)">五爱</div><div onclick="selectDropdownValue(this)">卡六爱</div></div></div>
                    </div>
                    <div style="margin-bottom:35px;"><label style="font-weight:bold;font-size:16px;">地区：</label>
                        <div class="cust-select"><input id="regionInput" style="width:120px;height:30px;"><div class="dropdown-btn" onclick="toggleDropdown(this)">▼</div><div class="options"><div onclick="selectDropdownValue(this)">风眠镇</div><div onclick="selectDropdownValue(this)">洛克里安</div><div onclick="selectDropdownValue(this)">淘晶镇</div></div></div>
                    </div>
                    <div style="margin-bottom:35px;"><label style="font-weight:bold;font-size:16px;">备注：</label>
                        <input id="noteInput" class="entry-field" style="width:150px; height:30px; font-weight:normal;" placeholder="选填">
                    </div>
                </div>
                <div style="width:240px;">
                    <div style="margin-bottom:25px;display:flex;align-items:center;"><div class="icon-block" style="background-color:#1a1a1a;"></div><input id="blackEntry" class="entry-field" style="width:120px;height:40px;margin:0 8px;font-size:18px;"><button class="restore-btn" onclick="restoreSingle('black')">↺</button></div>
                    <div style="margin-bottom:25px;display:flex;align-items:center;"><div class="icon-block" style="background-color:#f1c40f;"></div><input id="yellowEntry" class="entry-field" style="width:120px;height:40px;margin:0 8px;font-size:18px;"><button class="restore-btn" onclick="restoreSingle('yellow')">↺</button></div>
                    <div style="margin-bottom:25px;display:flex;align-items:center;"><div class="icon-block" style="background-color:#2980b9;"></div><input id="blueEntry" class="entry-field" style="width:120px;height:40px;margin:0 8px;font-size:18px;"><button class="restore-btn" onclick="restoreSingle('blue')">↺</button></div>
                    <div style="margin-bottom:25px;display:flex;align-items:center;"><div class="icon-block" style="background-color:#8e44ad;"></div><input id="purpleEntry" class="entry-field" style="width:120px;height:40px;margin:0 8px;font-size:18px;"><button class="restore-btn" onclick="restoreSingle('purple')">↺</button></div>
                </div>
            </div>
            <div style="display:flex;justify-content:space-around;margin:25px 0;">
                <button style="background:#dcdcdc;color:black;padding:10px 18px;font-weight:bold;" onclick="clearResult()">清空表格</button>
                <button style="background:#ff69b4;color:white;padding:10px 18px;font-weight:bold;" onclick="recordToday()">生成</button>
                <button style="background:#ffb6c1;color:white;padding:10px 18px;font-weight:bold;" onclick="restoreAll()">全部恢复</button>
            </div>
            <div id="resultContainer" class="result-list"></div>
        </div>
    </div>

    <!-- 总量页 -->
    <div id="totalPage" class="page" style="background:#fff0f5; padding:60px 20px 20px 20px;">
        <h3 style="text-align:center;">初始化 / 修改库存</h3>
        <p style="text-align:center;">请输入当前四种矿物数量：</p>
        <div style="display:flex; flex-direction:column; align-items:center; margin:15px 0;">
            <div style="margin:5px;"><label>黑矿</label><input id="totalBlack" class="total-entry" type="number"></div>
            <div style="margin:5px;"><label>黄矿</label><input id="totalYellow" class="total-entry" type="number"></div>
            <div style="margin:5px;"><label>蓝矿</label><input id="totalBlue" class="total-entry" type="number"></div>
            <div style="margin:5px;"><label>紫矿</label><input id="totalPurple" class="total-entry" type="number"></div>
        </div>
        <div style="display:flex; justify-content:center; gap:15px;">
            <button style="background:#ffb6c1; color:white; padding:8px 20px;" onclick="submitTotal()">确认修改</button>
            <button style="background:#ccc; padding:8px 20px;" onclick="showPage('mainPage')">返回</button>
        </div>
    </div>

    <!-- 设置页 -->
    <div id="settingsPage" class="page" style="background:white; padding:60px 20px 20px 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3>⚙️ 设置</h3>
            <button style="background:#ccc; padding:5px 15px;" onclick="showPage('mainPage')">返回</button>
        </div>
        <div>
            <strong>数据管理：</strong>
            <button style="background:#e74c3c; color:white; padding:8px 16px; margin-top:10px;" onclick="clearAllData()">清空所有数据（含总量）</button>
        </div>
    </div>

    <!-- 历史页 -->
    <div id="historyPage" class="page" style="background:white; padding:60px 10px 10px 10px; flex-direction:column;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3>📅 历史跑量</h3>
            <button style="background:#ccc; padding:5px 15px;" onclick="showPage('mainPage')">返回</button>
        </div>
        <div style="display:flex; align-items:center; margin-bottom:5px;">
            <label><input type="checkbox" id="selectAllCheck" onclick="toggleSelectAllHistory(this)"> 全选</label>
            <div style="margin-left:auto; display:flex; gap:5px;">
                <button style="background:#f39c12; color:white; padding:4px 10px;" onclick="deleteSelectedHistory()">删除选中</button>
                <button style="background:#e74c3c; color:white; padding:4px 10px;" onclick="clearAllHistory()">清空全部历史</button>
                <button style="background:#2ecc71; color:white; padding:4px 10px;" onclick="restoreDeletedHistory()">恢复最近删除</button>
            </div>
        </div>
        <div id="historyContent" style="flex:1; overflow-y:auto;"></div>
    </div>

</div>

<script>
    // ========== 数据存储 ==========
    var DATA_KEY = "mineral_app_data";
    var data = [];
    var lastInputs = { black:"", yellow:"", blue:"", purple:"" };
    var deletedRecords = [];

    function loadData() {
        var stored = localStorage.getItem(DATA_KEY);
        data = stored ? JSON.parse(stored) : [];
        ensureTotal();
    }
    function saveData() {
        localStorage.setItem(DATA_KEY, JSON.stringify(data));
    }
    function ensureTotal() {
        for(var i=0; i<data.length; i++) if(data[i].type === "total") return;
        var last = null;
        for(var i=data.length-1; i>=0; i--) if(data[i].hasOwnProperty("black")) { last = data[i]; break; }
        data.push({type:"total", black:last?last.black:0, yellow:last?last.yellow:0, blue:last?last.blue:0, purple:last?last.purple:0});
        saveData();
    }
    function getTotal() {
        for(var i=0; i<data.length; i++) if(data[i].type === "total") return data[i];
        return {black:0, yellow:0, blue:0, purple:0};
    }
    function updateTotal(b,y,bl,p) {
        for(var i=0; i<data.length; i++) if(data[i].type === "total") {
            data[i].black = b; data[i].yellow = y; data[i].blue = bl; data[i].purple = p;
            saveData(); return;
        }
        data.push({type:"total", black:b, yellow:y, blue:bl, purple:p});
        saveData();
    }

    // ========== 工具 ==========
    function padZero(n) { return n<10 ? '0'+n : ''+n; }
    function formatDiff(d) { return (d==null || isNaN(d)) ? '' : (d>=0 ? '+' : '') + d; }

    // ========== 页面切换 ==========
    function showPage(id) {
        var pages = document.querySelectorAll('.page');
        for(var i=0; i<pages.length; i++) {
            pages[i].classList.remove('active');
            pages[i].style.display = 'none';
        }
        var target = document.getElementById(id);
        if(target) {
            target.classList.add('active');
            if(id === 'historyPage') {
                target.style.display = 'flex';
            } else {
                target.style.display = 'block';
            }
        }
        if(id !== 'historyPage') {
            var hc = document.getElementById('historyContent');
            if(hc) hc.innerHTML = '';
        }
        if(id === 'mainPage') {
            updateDate();
            updateTotalLabel();
            refreshTable();
        } else if(id === 'totalPage') {
            loadData();
            updateTotalInputs();
        } else if(id === 'historyPage') {
            buildHistory();
        }
    }

    // ========== 主界面 ==========
    function clearInputs() {
        document.getElementById('blackEntry').value = '';
        document.getElementById('yellowEntry').value = '';
        document.getElementById('blueEntry').value = '';
        document.getElementById('purpleEntry').value = '';
        document.getElementById('timeInput').value = '';
        document.getElementById('pokemonInput').value = '';
        document.getElementById('regionInput').value = '';
        document.getElementById('noteInput').value = '';
    }
    function updateDate() {
        var d = new Date();
        document.getElementById('dateVar').value = (d.getMonth()+1) + '.' + d.getDate();
    }
    function updateTotalLabel() {
        var t = getTotal();
        document.getElementById('totalBtn').innerHTML = '矿物总量：' + (t.black + t.yellow + t.blue + t.purple);
    }
    function restoreSingle(m) {
        var el = document.getElementById(m + 'Entry');
        if(lastInputs[m] !== undefined) el.value = lastInputs[m];
    }
    function restoreAll() { for(var m in lastInputs) restoreSingle(m); }
    function clearResult() {
        var c = document.getElementById('resultContainer');
        if(c) c.innerHTML = '';
    }
    function refreshTable() {
        var container = document.getElementById('resultContainer');
        if(!container) return;
        var recs = data.filter(function(r){ return r.type === 'record'; });
        if(recs.length === 0) { container.innerHTML = ''; return; }
        var last = recs[recs.length-1];
        var html = '';
        html += '<div class="result-row"><span class="result-label">日期：</span><span class="result-value">' + (last.date||'') + '</span></div>';
        html += '<div class="result-row"><span class="result-label">时间：</span><span class="result-value">' + (last.duration||'') + '</span></div>';
        html += '<div class="result-row"><span class="result-label">精灵：</span><span class="result-value">' + (last.pokemon||'') + '</span></div>';
        html += '<div class="result-row"><span class="result-label">地区：</span><span class="result-value">' + (last.region||'') + '</span></div>';
        html += '<div class="result-row"><span class="result-label">黑矿：</span><span class="result-value">' + formatDiff(last.blackDiff) + '</span></div>';
        html += '<div class="result-row"><span class="result-label">黄矿：</span><span class="result-value">' + formatDiff(last.yellowDiff) + '</span></div>';
        html += '<div class="result-row"><span class="result-label">蓝矿：</span><span class="result-value">' + formatDiff(last.blueDiff) + '</span></div>';
        html += '<div class="result-row"><span class="result-label">紫矿：</span><span class="result-value">' + formatDiff(last.purpleDiff) + '</span></div>';
        if(last.note) html += '<div class="result-row"><span class="result-label">备注：</span><span class="result-value">' + last.note + '</span></div>';
        container.innerHTML = html;
    }

    // ========== 生成记录（去掉弹窗） ==========
    function recordToday() {
        loadData();
        var t = getTotal();
        var b = parseInt(document.getElementById('blackEntry').value) || 0;
        var y = parseInt(document.getElementById('yellowEntry').value) || 0;
        var bl = parseInt(document.getElementById('blueEntry').value) || 0;
        var p = parseInt(document.getElementById('purpleEntry').value) || 0;
        if(isNaN(b)||isNaN(y)||isNaN(bl)||isNaN(p)) { alert('请输入有效整数'); return; }
        var bd = b - t.black, yd = y - t.yellow, bld = bl - t.blue, pd = p - t.purple;
        var date = document.getElementById('dateVar').value.trim() || (new Date().getMonth()+1) + '.' + new Date().getDate();
        var dur = document.getElementById('timeInput').value.trim();
        var poke = document.getElementById('pokemonInput').value.trim();
        var reg = document.getElementById('regionInput').value.trim();
        var note = document.getElementById('noteInput').value.trim();
        lastInputs.black = b; lastInputs.yellow = y; lastInputs.blue = bl; lastInputs.purple = p;
        var now = new Date();
        var time = padZero(now.getHours()) + ':' + padZero(now.getMinutes()) + ':' + padZero(now.getSeconds());
        var rec = {
            type: "record",
            date: date,
            time: time,
            duration: dur,
            pokemon: poke,
            region: reg,
            black: b, yellow: y, blue: bl, purple: p,
            blackDiff: bd, yellowDiff: yd, blueDiff: bld, purpleDiff: pd,
            note: note,
            real_time: now.getFullYear() + '-' + (now.getMonth()+1) + '-' + now.getDate() + ' ' + time
        };
        data.push(rec);
        updateTotal(b, y, bl, p);
        saveData();
        clearInputs();
        refreshTable();   // 直接显示结果
        updateTotalLabel();
        // 不再使用 alert
    }

    // ========== 总量页面 ==========
    function updateTotalInputs() {
        var t = getTotal();
        document.getElementById('totalBlack').value = t.black;
        document.getElementById('totalYellow').value = t.yellow;
        document.getElementById('totalBlue').value = t.blue;
        document.getElementById('totalPurple').value = t.purple;
    }
    function submitTotal() {
        var b = parseInt(document.getElementById('totalBlack').value) || 0;
        var y = parseInt(document.getElementById('totalYellow').value) || 0;
        var bl = parseInt(document.getElementById('totalBlue').value) || 0;
        var p = parseInt(document.getElementById('totalPurple').value) || 0;
        updateTotal(b, y, bl, p);
        data = data.filter(function(r){ return r.type !== 'init'; });
        var now = new Date();
        data.push({
            type: "init",
            date: now.getFullYear() + '-' + (now.getMonth()+1) + '-' + now.getDate(),
            time: padZero(now.getHours()) + ':' + padZero(now.getMinutes()) + ':' + padZero(now.getSeconds()),
            black: b, yellow: y, blue: bl, purple: p,
            blackDiff: 0, yellowDiff: 0, blueDiff: 0, purpleDiff: 0
        });
        saveData();
        clearInputs();
        updateTotalLabel();
        refreshTable();
        alert('库存已更新！');
        showPage('mainPage');
    }

    // ========== 设置页面 ==========
    function clearAllData() {
        if(confirm('清空所有数据？总量、记录均删除。')) {
            data = [];
            saveData();
            clearInputs();
            updateDate();
            updateTotalLabel();
            refreshTable();
            alert('数据已清空');
        }
    }

    // ========== 历史记录 ==========
    function buildHistory() {
        var container = document.getElementById('historyContent');
        if(!container) return;
        loadData();
        var records = data.filter(function(r){ return r.type === 'record'; });
        if(records.length === 0 && deletedRecords.length === 0) {
            container.innerHTML = '<p style="text-align:center;color:#999;">暂无历史记录</p>';
            return;
        }
        records.sort(function(a,b){ return (b.real_time||'').localeCompare(a.real_time||''); });
        var groups = {};
        for(var i=0; i<records.length; i++) {
            var d = records[i].date || '未知日期';
            if(!groups[d]) groups[d] = [];
            groups[d].push(records[i]);
        }
        var dates = Object.keys(groups).sort(function(a,b){ return b.localeCompare(a); });
        var html = '';
        for(var j=0; j<dates.length; j++) {
            var date = dates[j];
            var recs = groups[date];
            html += '<div class="date-group">';
            html += '<div class="date-title" onclick="toggleDateGroup(this)">' + date + '（' + recs.length + '单）</div>';
            html += '<div class="records-list" style="display:none;">';
            for(var k=0; k<recs.length; k++) {
                var rec = recs[k];
                var globalIdx = records.indexOf(rec) + 1;
                var time = rec.time || '';
                var line1 = 'No.' + globalIdx + ' 时间：' + time + ' 用时：' + (rec.duration||'') + ' 精灵：' + (rec.pokemon||'') + ' 地区：' + (rec.region||'');
                var line2 = '黑矿：' + formatDiff(rec.blackDiff) + ' 黄矿：' + formatDiff(rec.yellowDiff) + ' 蓝矿：' + formatDiff(rec.blueDiff) + ' 紫矿：' + formatDiff(rec.purpleDiff);
                var noteHtml = rec.note ? ' <span class="note-text" onclick="editNote(' + records.indexOf(rec) + ')">📝' + rec.note + '</span>' : ' <span class="note-text" onclick="editNote(' + records.indexOf(rec) + ')" style="color:#aaa;">+备注</span>';
                html += '<div class="history-item">';
                html += '<input type="checkbox" class="history-check" value="' + records.indexOf(rec) + '">';
                html += '<div>' + line1 + noteHtml + '</div>';
                html += '<div style="color:#555;">' + line2 + '</div>';
                html += '</div>';
            }
            html += '</div></div>';
        }
        container.innerHTML = html;
        document.getElementById('selectAllCheck').checked = false;
    }
    function toggleDateGroup(el) {
        var list = el.nextElementSibling;
        if(list) list.style.display = (list.style.display === 'none' || list.style.display === '') ? 'block' : 'none';
    }
    function editNote(index) {
        loadData();
        var records = data.filter(function(r){ return r.type === 'record'; });
        records.sort(function(a,b){ return (b.real_time||'').localeCompare(a.real_time||''); });
        if(index >= 0 && index < records.length) {
            var rec = records[index];
            var newNote = prompt('请输入备注（可留空）：', rec.note || '');
            if(newNote !== null) {
                rec.note = newNote.trim();
                saveData();
                buildHistory();
                refreshTable();
            }
        }
    }
    function toggleSelectAllHistory(cb) {
        var checks = document.querySelectorAll('.history-check');
        for(var i=0; i<checks.length; i++) checks[i].checked = cb.checked;
    }
    function deleteSelectedHistory() {
        var checks = document.querySelectorAll('.history-check:checked');
        if(checks.length === 0) { alert('请选择记录'); return; }
        if(!confirm('删除选中的 ' + checks.length + ' 条记录？')) return;
        loadData();
        var records = data.filter(function(r){ return r.type === 'record'; });
        records.sort(function(a,b){ return (b.real_time||'').localeCompare(a.real_time||''); });
        var toDelete = [];
        for(var i=0; i<checks.length; i++) {
            var idx = parseInt(checks[i].value);
            if(!isNaN(idx) && idx >= 0 && idx < records.length) toDelete.push(records[idx]);
        }
        for(var j=0; j<toDelete.length; j++) {
            deletedRecords.push(toDelete[j]);
            data = data.filter(function(r){ return r !== toDelete[j]; });
        }
        saveData();
        updateTotalLabel();
        refreshTable();
        alert('已删除');
        buildHistory();
    }
    function clearAllHistory() {
        if(!confirm('清空全部历史')) return;
        loadData();
        var recs = data.filter(function(r){ return r.type === 'record'; });
        deletedRecords = deletedRecords.concat(recs);
        data = data.filter(function(r){ return r.type !== 'record'; });
        saveData();
        updateTotalLabel();
        refreshTable();
        alert('历史已清空');
        buildHistory();
    }
    function restoreDeletedHistory() {
        if(deletedRecords.length === 0) { alert('没有可恢复的记录'); return; }
        data = data.concat(deletedRecords);
        data.sort(function(a,b){ return (b.real_time||'').localeCompare(a.real_time||''); });
        saveData();
        deletedRecords = [];
        refreshTable();
        updateTotalLabel();
        alert('已恢复');
        buildHistory();
    }

    // ========== 下拉框 ==========
    function toggleDropdown(btn) {
        var p = btn.parentNode, o = p.querySelector('.options');
        if(o) {
            o.style.display = (o.style.display === 'block') ? 'none' : 'block';
            document.addEventListener('click', function h(e) {
                if(!p.contains(e.target)) {
                    o.style.display = 'none';
                    document.removeEventListener('click', h);
                }
            });
        }
    }
    function selectDropdownValue(div) {
        var v = div.innerHTML;
        var o = div.parentNode;
        var inp = o.parentNode.querySelector('input');
        if(inp) inp.value = v;
        o.style.display = 'none';
    }

    // ========== 自适应缩放 ==========
    function resizeApp() {
        var sw = window.innerWidth, sh = window.innerHeight;
        var scale = Math.min(sw / 480, sh / 800);
        document.documentElement.style.setProperty('--scale', scale);
    }
    window.addEventListener('resize', resizeApp);

    // ========== 启动 ==========
    window.onload = function() {
        resizeApp();
        loadData();
        showPage('mainPage');
    };
</script>
</body>
</html>
